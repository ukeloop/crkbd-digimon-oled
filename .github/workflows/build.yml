name: Build firmware

on:
  push:
    branches: [master, main, fix/ci-preserve-upstream-crkbd]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout QMK firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: 0.8.192
          submodules: recursive
          path: qmk_firmware

      - name: Checkout this keyboard firmware
        uses: actions/checkout@v4
        with:
          path: crkbd-digimon-oled

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr binutils-avr avr-libc dfu-programmer dfu-util rsync
          python3 -m pip install --user -r qmk_firmware/requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Overlay custom Corne files while preserving upstream files
        run: |
          rsync -a --exclude='.git/' --exclude='.github/' crkbd-digimon-oled/ qmk_firmware/keyboards/crkbd/
          # QMK 0.8.192 provides WPM support; keep the legacy source unchanged in this repository,
          # but remove the obsolete pincontrol include from the CI working copy only.
          sed -i '/^[[:space:]]*#include "pincontrol.h"[[:space:]]*$/d' qmk_firmware/keyboards/crkbd/ssd1306.h

      - name: Build firmware
        working-directory: qmk_firmware
        run: make crkbd:default

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: crkbd-digimon-oled-firmware
          path: |
            qmk_firmware/**/*.hex
            qmk_firmware/**/*.bin
          if-no-files-found: error
          retention-days: 14
