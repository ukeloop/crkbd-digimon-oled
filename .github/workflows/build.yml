name: Build firmware

on:
  push:
    branches: [master, main, fix/ci-preserve-upstream-crkbd, fix/qmk-current-master-compat]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout QMK firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          # Pin to the latest stable QMK release; update deliberately when a new release is published.
          ref: 0.34.7
          submodules: recursive
          path: qmk_firmware

      - name: Checkout this keyboard firmware
        uses: actions/checkout@v4
        with:
          path: crkbd-digimon-oled

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr binutils-avr avr-libc dfu-programmer dfu-util rsync
          python3 -m pip install --user -r qmk_firmware/requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Overlay custom Corne files while preserving upstream files
        run: |
          rsync -a --exclude='.git/' --exclude='.github/' crkbd-digimon-oled/ qmk_firmware/keyboards/crkbd/
          # This repository still carries the legacy SSD1306 driver header.
          # Remove its obsolete include in the CI working tree only.
          sed -i '/^[[:space:]]*#include "pincontrol.h"[[:space:]]*$/d' qmk_firmware/keyboards/crkbd/ssd1306.h

      - name: Build firmware
        working-directory: qmk_firmware
        run: make crkbd/rev1:default

      - name: Report flash and RAM usage
        working-directory: qmk_firmware
        shell: bash
        run: |
          set -euo pipefail
          memory_report="$(avr-size -C --mcu=atmega32u4 .build/crkbd_rev1_default.elf)"
          printf '%s\n' "$memory_report"

          ram_used="$(printf '%s\n' "$memory_report" | sed -nE 's/^[[:space:]]*Data:[[:space:]]*([0-9]+) bytes.*/\1/p')"
          if [[ -z "$ram_used" ]]; then
            echo "Could not parse RAM usage from avr-size output." >&2
            exit 1
          fi

          # ATmega32U4 has 2,560 bytes of SRAM. Keep at least 512 bytes
          # outside static data/BSS for stack and runtime headroom.
          ram_total=2560
          ram_limit=2048
          ram_remaining=$((ram_total - ram_used))
          echo "Static RAM used: ${ram_used}/${ram_total} bytes"
          echo "SRAM remaining after static data: ${ram_remaining} bytes"
          echo "Static RAM budget (80%): ${ram_limit} bytes"

          if (( ram_used > ram_limit )); then
            echo "Static RAM usage exceeds the 80% budget; review memory use." >&2
            exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: crkbd-digimon-oled-firmware
          path: |
            qmk_firmware/**/*.hex
            qmk_firmware/**/*.bin
          if-no-files-found: error
          retention-days: 14
