name: Build firmware

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout QMK firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          # Pin to the latest stable QMK release; update deliberately when a new release is published.
          ref: 0.34.7
          submodules: recursive
          path: qmk_firmware

      - name: Checkout this keyboard firmware
        uses: actions/checkout@v4
        with:
          path: crkbd-digimon-oled

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr binutils-avr avr-libc dfu-programmer dfu-util rsync
          python3 -m pip install --user -r qmk_firmware/requirements.txt
          python3 -m pip install --user qmk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Overlay custom Corne files while preserving upstream files
        run: |
          # Preserve upstream Corne keyboard metadata, split transport, and build configuration.
          # Only overlay the custom OLED driver, I2C master transport, and this project's keymap/assets.
          rsync -a --exclude='.git/' --exclude='.github/' \
            --exclude='/config.h' --exclude='/rules.mk' --exclude='/info.json' \
            --exclude='/crkbd.c' --exclude='/crkbd.h' --exclude='/rev1/' \
            --exclude='/serial.c' --exclude='/serial.h' \
            crkbd-digimon-oled/ qmk_firmware/keyboards/crkbd/

      - name: Build firmware
        working-directory: qmk_firmware
        run: make crkbd/rev1:default

      - name: Report flash and RAM usage
        working-directory: qmk_firmware
        shell: bash
        run: |
          set -euo pipefail
          memory_report="$(avr-size -C --mcu=atmega32u4 .build/crkbd_rev1_default.elf)"
          printf '%s\n' "$memory_report"

          flash_used="$(printf '%s\n' "$memory_report" | sed -nE 's/^[[:space:]]*Program:[[:space:]]*([0-9]+) bytes.*/\1/p')"
          ram_used="$(printf '%s\n' "$memory_report" | sed -nE 's/^[[:space:]]*Data:[[:space:]]*([0-9]+) bytes.*/\1/p')"
          if [[ -z "$flash_used" || -z "$ram_used" ]]; then
            echo "Could not parse flash/RAM usage from avr-size output." >&2
            exit 1
          fi

          # ATmega32U4 has 32,768 bytes of flash and 2,560 bytes of SRAM.
          # Keep flash below 90% and static RAM below 80% for runtime headroom.
          flash_total=32768
          flash_limit=29491
          ram_total=2560
          ram_limit=2048
          flash_remaining=$((flash_total - flash_used))
          ram_remaining=$((ram_total - ram_used))
          echo "Flash used: ${flash_used}/${flash_total} bytes"
          echo "Flash remaining: ${flash_remaining} bytes"
          echo "Flash budget (90%): ${flash_limit} bytes"
          echo "Static RAM used: ${ram_used}/${ram_total} bytes"
          echo "SRAM remaining after static data: ${ram_remaining} bytes"
          echo "Static RAM budget (80%): ${ram_limit} bytes"

          if (( flash_used > flash_limit )); then
            echo "Flash usage exceeds the 90% budget; review program size." >&2
            exit 1
          fi
          if (( ram_used > ram_limit )); then
            echo "Static RAM usage exceeds the 80% budget; review memory use." >&2
            exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: crkbd-digimon-oled-firmware
          path: |
            qmk_firmware/**/*.hex
            qmk_firmware/**/*.bin
          if-no-files-found: error
          retention-days: 14
